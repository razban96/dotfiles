scan_timeout = 10
command_timeout = 500
add_newline = false

format = """
$directory$git_branch$git_status$python$dotnet$cmake$cmd_duration$line_break$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = '([\[$all_status$ahead_behind\]]($style) )'

[python]
symbol = "🐍 "
style = "yellow"
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[dotnet]
symbol = ".NET "
style = "blue"
format = "via [$symbol($version )]($style)"

[cmake]
symbol = "△ "
style = "green"
format = "via [$symbol($version )]($style)"

[cmd_duration]
min_time = 1500
style = "bold yellow"
format = "took [$duration]($style) "